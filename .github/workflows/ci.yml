name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: build + test (windows, msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cursor-doom

      - name: Formatting
        working-directory: cursor-doom
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: cursor-doom
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Build
        working-directory: cursor-doom
        run: cargo build --release

      - name: Test
        working-directory: cursor-doom
        run: cargo test --release

      - name: Headless engine smoke test
        working-directory: cursor-doom
        shell: pwsh
        run: |
          # The engine needs a WAD; without one we only check that the binary
          # starts and prints its help, which exercises the argument parser and
          # the C++/Rust link.
          ./target/release/cursor-doom.exe --help
